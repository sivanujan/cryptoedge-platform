<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoEdge Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050608;
            --bg-secondary: #0a0c10;
            --bg-card: #0f1218;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --cyan: #00e5ff;
            --green: #00e676;
            --red: #ff1744;
            --purple: #d500f9;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .cyber-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }

        .nav-link {
            display: flex;
            items-center: center;
            padding: 12px 16px;
            color: var(--text-secondary);
            border-radius: 8px;
            transition: all 0.2s;
            margin: 4px 12px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 229, 255, 0.1);
            color: var(--cyan);
        }

        .main-content {
            margin-left: 260px;
            padding: 24px;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="sidebar flex flex-col pt-6">
        <div class="px-6 mb-8">
            <h1 class="text-2xl font-bold tracking-tighter text-white flex items-center gap-2">
                <span class="text-cyan-400">CRYPTO</span>EDGE
            </h1>
        </div>

        <nav class="flex-1">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <span class="mr-3">📊</span> Dashboard
            </a>
            <a href="/signals" class="nav-link {% if request.path == '/signals' %}active{% endif %}">
                <span class="mr-3">🚨</span> Signals
            </a>
            <a href="/strategies" class="nav-link">
                <span class="mr-3">⚡</span> Strategies
            </a>
            <a href="/settings" class="nav-link">
                <span class="mr-3">⚙️</span> Settings
            </a>
        </nav>

        <div class="p-6 border-t border-white/5 mt-auto">
            <div class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-2">SYSTEM STATUS</div>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-white font-medium">CORE ONLINE</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-bold">{% block title %}{% endblock %}</h2>
                <p class="text-slate-400 text-sm">{% block subtitle %}{% endblock %}</p>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">BTC/USDT</span>
                    <span id="btc-price" class="text-lg font-mono font-bold text-cyan-400">Loading...</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center">
                    <span class="text-xs font-bold">JD</span>
                </div>
            </div>
        </header>

        {% block content %}{% endblock %}
    </div>

    <script>
        // Simple mock price updates for now
        function updatePrice() {
            const price = 65000 + Math.random() * 1000;
            const el = document.getElementById('btc-price');
            if (el) el.innerText = '$' + price.toLocaleString('en-US', {minimumFractionDigits: 2});
        }
        setInterval(updatePrice, 2000);
        updatePrice();
    </script>
</body>
</html>
